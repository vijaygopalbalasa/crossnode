<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Helvetica, Arial, sans-serif">
  <title>Crossnode zonal demo: three QNX 8.0 machines</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Crossnode: a device on another QNX 8.0 machine, by its path</text>
  <text x="600" y="64" text-anchor="middle" font-size="15" fill="#475569">Zonal demo on three QEMU machines (a labelled simulation). Every Crossnode and sensor program runs non-root under its own security type.</text>

  <!-- central -->
  <rect x="420" y="96" width="360" height="420" rx="14" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="600" y="126" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">central</text>
  <rect x="445" y="142" width="310" height="92" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="600" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">unmodified programs</text>
  <text x="600" y="190" text-anchor="middle" font-size="14" fill="#334155" font-family="Menlo, monospace">cat  ls  stat  stty  cnprobe</text>
  <text x="600" y="214" text-anchor="middle" font-size="13" fill="#475569">open, read, write, devctl, stat, readdir</text>
  <line x1="600" y1="234" x2="600" y2="268" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="610" y="257" font-size="12" fill="#475569">pathname space</text>
  <rect x="445" y="270" width="148" height="150" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="519" y="294" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">crossnode-net</text>
  <text x="519" y="314" text-anchor="middle" font-size="13" fill="#312e81" font-family="Menlo, monospace">/net/front</text>
  <rect x="607" y="270" width="148" height="150" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="681" y="294" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">crossnode-net</text>
  <text x="681" y="314" text-anchor="middle" font-size="13" fill="#312e81" font-family="Menlo, monospace">/net/rear</text>
  <g font-size="11.5" fill="#3730a3">
    <text x="455" y="340">resource manager</text>
    <text x="455" y="356">dispatch thread never</text>
    <text x="455" y="372">waits on the network</text>
    <text x="455" y="392">unblock pulse: EINTR</text>
    <text x="455" y="408">2 s silence: EHOSTDOWN</text>
    <text x="617" y="340">one per zone</text>
    <text x="617" y="356">type crossnode_net_t</text>
    <text x="617" y="372">may attach only</text>
    <text x="617" y="388">/net/front, /net/rear</text>
    <text x="617" y="408">same pids after a reboot</text>
  </g>
  <text x="600" y="448" text-anchor="middle" font-size="13" fill="#0f172a">immutable security policy (secpol)</text>
  <text x="600" y="468" text-anchor="middle" font-size="13" fill="#0f172a">boot image starts everything; a key per link, mode 600</text>
  <text x="600" y="496" text-anchor="middle" font-size="12" fill="#64748b">vtnet1 10.9.0.1           vtnet2 10.10.0.1</text>

  <!-- front -->
  <rect x="40" y="150" width="300" height="300" rx="14" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="190" y="180" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">front zone</text>
  <rect x="62" y="196" width="256" height="104" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="190" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">crossnode-agent</text>
  <g font-size="11" fill="#065f46">
    <text x="74" y="240">uid 70, type crossnode_agent_t, no path ability</text>
    <text x="74" y="256">shares only /dev/hello and /dev/temp</text>
    <text x="74" y="272">own key for this link; realpath, iofdinfo</text>
    <text x="74" y="288">a slow device is never taken for a dead node</text>
  </g>
  <rect x="62" y="316" width="122" height="62" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="123" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">hellodev</text>
  <text x="123" y="360" text-anchor="middle" font-size="12" fill="#334155" font-family="Menlo, monospace">/dev/hello</text>
  <rect x="196" y="316" width="122" height="62" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="257" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">zonesensor</text>
  <text x="257" y="360" text-anchor="middle" font-size="12" fill="#334155" font-family="Menlo, monospace">/dev/temp</text>
  <text x="190" y="404" text-anchor="middle" font-size="12" fill="#64748b">sensors run as uid 71 (simulated)</text>
  <text x="190" y="430" text-anchor="middle" font-size="12" fill="#64748b">vtnet1 10.9.0.2</text>

  <!-- rear -->
  <rect x="860" y="150" width="300" height="300" rx="14" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="1010" y="180" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">rear zone</text>
  <rect x="882" y="196" width="256" height="104" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="1010" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">crossnode-agent</text>
  <g font-size="11" fill="#065f46">
    <text x="894" y="240">uid 70, type crossnode_agent_t, no path ability</text>
    <text x="894" y="256">shares only /dev/radar</text>
    <text x="894" y="272">own key for this link; reaches only its sensor</text>
    <text x="894" y="288">power cut in the demo, then a reboot</text>
  </g>
  <rect x="949" y="316" width="122" height="62" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="1010" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">zonesensor</text>
  <text x="1010" y="360" text-anchor="middle" font-size="12" fill="#334155" font-family="Menlo, monospace">/dev/radar</text>
  <text x="1010" y="404" text-anchor="middle" font-size="12" fill="#64748b">radar runs as uid 71 (simulated)</text>
  <text x="1010" y="430" text-anchor="middle" font-size="12" fill="#64748b">vtnet1 10.10.0.2</text>

  <!-- links -->
  <line x1="340" y1="300" x2="445" y2="330" stroke="#334155" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="352" y="286" font-size="12" fill="#334155">TCP, direct link</text>
  <line x1="860" y1="300" x2="755" y2="330" stroke="#334155" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="770" y="286" font-size="12" fill="#334155">TCP, direct link</text>

  <!-- footer -->
  <rect x="40" y="540" width="1120" height="76" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="60" y="566" font-size="14" fill="#7c2d12">Shown by test/zonal.sh on the enforced set (transcripts in evidence/): rear loses power while central reads /dev/radar;</text>
  <text x="60" y="586" font-size="14" fill="#7c2d12">the read fails with EHOSTDOWN after 2 s of silence (test bound 2000 + 200 ms), front keeps answering, rear reboots and</text>
  <text x="60" y="606" font-size="14" fill="#7c2d12">central reads it again with the same crossnode-net processes. Bounds are for this code on QEMU, not QNX figures.</text>
</svg>
